apiVersion: v1
kind: ServiceAccount
metadata:
  name: attack-simulator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: attack-simulator
rules:
- apiGroups: [""]
  resources: ["configmaps", "pods"]
  verbs: ["get", "list", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attack-simulator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: attack-simulator
subjects:
- kind: ServiceAccount
  name: attack-simulator
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-simulator
  template:
    metadata:
      labels:
        app: attack-simulator
    spec:
      serviceAccountName: attack-simulator
      containers:
      - name: attacker
        image: attack-simulator:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi